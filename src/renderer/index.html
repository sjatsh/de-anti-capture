<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*" />
  <link rel="stylesheet" href="style.css" />
  <title>窗口保活 / API 拦截工具</title>
</head>
<body>
  <!-- ===== SVG 图标精灵 ===== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></symbol>
      <symbol id="i-inject" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol>
      <symbol id="i-eject" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
      <symbol id="i-zap" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
      <symbol id="i-win-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-win-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></symbol>
      <symbol id="i-win-restore" viewBox="0 0 24 24"><rect x="7" y="7" width="11" height="11" rx="1.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4H18a2 2 0 0 1 2 2v7.5A1.5 1.5 0 0 1 18.5 15H17"/></symbol>
      <symbol id="i-win-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <!-- 应用 logo：彩色，独立于线性图标（不被 .ico 的 fill:none/stroke 影响） -->
      <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
      <linearGradient id="lgPulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
      <symbol id="i-logo" viewBox="0 0 256 256">
        <rect x="20" y="20" width="216" height="216" rx="52" fill="url(#lgBg)"/>
        <rect x="58" y="68" width="140" height="104" rx="18" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.92" stroke-width="7"/>
        <path d="M58 96 H198" stroke="#ffffff" stroke-opacity="0.92" stroke-width="7"/>
        <circle cx="78" cy="82" r="4.6" fill="#ffffff"/><circle cx="95" cy="82" r="4.6" fill="#ffffff"/>
        <path d="M70 140 H100 L113 116 L130 162 L145 134 H186" stroke="url(#lgPulse)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </symbol>
    </defs>
  </svg>

  <!-- ===== 自绘标题栏 ===== -->
  <header class="titlebar">
    <div class="tb-brand">
      <svg class="logo-mark" viewBox="0 0 256 256" aria-hidden="true"><use href="#i-logo"/></svg>
      <span class="tb-title">窗口保活 / API 拦截工具</span>
      <span class="tb-tag">Electron</span>
    </div>
    <div class="tb-right">
      <label class="switch" title="定时给保活规则的窗口发随机鼠标移动（不动你真实光标）">
        <input type="checkbox" id="kaToggle" checked />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label">保活定时器</span>
      </label>
      <div class="win-ctrls">
        <button class="wbtn" id="winMin" title="最小化"><svg class="ico"><use href="#i-win-min"/></svg></button>
        <button class="wbtn" id="winMax" title="最大化"><svg class="ico"><use href="#i-win-max"/></svg></button>
        <button class="wbtn close" id="winClose" title="关闭"><svg class="ico"><use href="#i-win-close"/></svg></button>
      </div>
    </div>
  </header>

  <main class="content">
    <!-- 顶部：所有可见窗口 -->
    <section class="panel winpanel" id="winpanel">
      <div class="panel-head">
        <svg class="ico head-ico"><use href="#i-monitor"/></svg>
        <span class="panel-title">所有可见窗口</span>
        <span class="pill count" id="winCount">0</span>
        <div class="searchbox">
          <svg class="ico"><use href="#i-search"/></svg>
          <input id="filter" placeholder="筛选 PID / 进程 / 标题 / 句柄…" />
        </div>
        <button id="toggleAll" class="btn ghost" title="把隐藏窗口/无标题窗口也列出来（如全屏云电脑的投屏窗口）"><svg class="ico"><use href="#i-eye"/></svg>显示隐藏</button>
        <button id="refresh" class="btn ghost"><svg class="ico"><use href="#i-refresh"/></svg>刷新</button>
        <button id="addTarget" class="btn primary"><svg class="ico"><use href="#i-plus"/></svg>加入目标</button>
      </div>
      <div class="table">
        <div class="thead">
          <div class="c-pid">PID</div><div class="c-proc">进程</div>
          <div class="c-title grow">窗口标题</div><div class="c-hwnd">句柄</div>
        </div>
        <div class="tbody" id="winBody"></div>
      </div>
    </section>

    <div class="divider" id="divider" title="拖拽调整窗口列表高度"><span></span></div>

    <!-- 下部：目标 + 规则 -->
    <section class="lower">
      <div class="panel targets">
        <div class="panel-head">
          <svg class="ico head-ico"><use href="#i-target"/></svg>
          <span class="panel-title">目标窗口</span>
          <span class="pill count" id="targetCount">0</span>
          <span class="spacer"></span>
          <button id="delTarget" class="btn ghost danger icononly" title="移除选中窗口"><svg class="ico"><use href="#i-trash"/></svg></button>
        </div>
        <div class="list" id="targetList"></div>
      </div>

      <div class="panel rules">
        <div class="panel-head">
          <svg class="ico head-ico"><use href="#i-layers"/></svg>
          <span class="panel-title">选中窗口的规则</span>
          <span class="hint" id="rulesHint"></span>
          <span class="spacer"></span>
          <button id="addRule" class="btn primary"><svg class="ico"><use href="#i-plus"/></svg>添加规则</button>
          <button id="editRule" class="btn ghost icononly" title="编辑"><svg class="ico"><use href="#i-edit"/></svg></button>
          <button id="delRule" class="btn ghost danger icononly" title="删除"><svg class="ico"><use href="#i-trash"/></svg></button>
        </div>
        <div class="list rulelist" id="ruleList"></div>
      </div>
    </section>
  </main>

  <!-- 下部/日志区高度拖拽条 -->
  <div class="divider vdiv" id="vdivider" title="拖拽：上调展开/加高活动日志，下调收起"><span></span></div>

  <!-- ===== 底部操作栏 ===== -->
  <footer class="footer">
    <div class="dllrow">
      <span class="lbl"><svg class="ico"><use href="#i-folder"/></svg>拦截 DLL</span>
      <span class="dll-badge" title="拦截 DLL 已内置并随程序一起打包，注入时自动使用，无需手动选择">内置 ✓</span>
      <span class="spacer"></span>
      <button id="inject" class="btn primary"><svg class="ico"><use href="#i-inject"/></svg>注入</button>
      <button id="eject" class="btn ghost"><svg class="ico"><use href="#i-eject"/></svg>卸载</button>
      <button id="apply" class="btn accent"><svg class="ico"><use href="#i-zap"/></svg>应用规则</button>
    </div>

    <div class="kbar">
      <svg class="ico kbar-ico"><use href="#i-zap"/></svg>
      <label class="switch" title="保持你的目标窗口处于已注入状态:对带「需注入规则」(idle / hook / 前台伪装 / 防截屏)的目标，持续保证它被注入并应用规则。目标进程重启/重连导致 PID 变化时,自动重新绑定并注入。适用于无影云会话进程,也适用于任何需要长期注入的程序。关闭仅停止自动维持(已注入的不动,可手动“卸载”还原)。">
        <input type="checkbox" id="autoInject" />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label">自动注入（目标 PID 变动自动重挂）</span>
      </label>
      <span class="hint">每 <input id="autoSec" type="number" min="2" max="60" value="5" class="mini-num" /> 秒巡检 · 带注入规则的目标若掉了/换了 PID 自动重新注入并应用规则</span>
    </div>

    <div class="kbar">
      <svg class="ico kbar-ico"><use href="#i-zap"/></svg>
      <label class="switch" title="系统级防休眠：调用 SetThreadExecutionState 声明“系统+显示器持续需要”，阻止整机睡眠/息屏（不改电源计划、不动你的真实光标）。这是防整机休眠的标准做法；但挡不住你手动睡眠/锁屏。">
        <input type="checkbox" id="stayAwake" />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label">系统级防休眠（不息屏/不睡眠）</span>
      </label>
      <span class="kbar-sep"></span>
      <label class="switch" title="真实输入心跳：用 SendInput 周期性发一次真实的无害输入（默认 F15 按键，不移动光标），更新系统全局“最后输入时间”，重置所有程序的空闲并击退屏保/睡眠。对用 GetLastInputInfo / 低级钩子 / 原始输入判活的程序有效——这正是 PostMessage 假鼠标做不到的。">
        <input type="checkbox" id="synthBeat" />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label">真实输入心跳</span>
      </label>
      <span class="hint">每 <input id="synthSec" type="number" min="5" max="300" value="50" class="mini-num" /> 秒 ·
        <select id="synthMode" class="mini-sel">
          <option value="key">F15 按键（不动光标）</option>
          <option value="mouse">鼠标微移 ±1px</option>
          <option value="both">按键 + 微移</option>
        </select>
      </span>
    </div>

    <div class="kbar">
      <svg class="ico kbar-ico"><use href="#i-zap"/></svg>
      <label class="switch" title="前台脉冲：给「窗口里的远端云电脑」(无影/串流客户端)喂真实输入，防远端会话休眠。客户端只转发它在前台时真正捕获到的输入(实测 stream_viewer 鼠标走 GetCursorPos 轮询、后台完全静默)，所以本机后台发消息无效，必须真把它切到前台再发真输入。开启后每隔 N 秒：记下当前前台→把目标窗口瞬时切前台→用 SendInput 发一次真实鼠标微移(±1px 净零)→立刻切回原窗口，焦点只闪几十毫秒。脉冲对象 = 勾了「保活」规则的目标窗口；目标已在前台时直接发输入、零闪烁。无影 15 分钟无操作才休眠，建议间隔 600~780 秒，一小时只闪四五下。开启脉冲后，对这些目标的 PostMessage 保活会自动跳过(对远端无效)。">
        <input type="checkbox" id="pulseMode" />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label">前台脉冲（给窗口内远端喂输入·防云电脑休眠）</span>
      </label>
      <span class="hint">每 <input id="pulseSec" type="number" min="30" max="900" value="600" class="mini-num" /> 秒切前台喂一次真实鼠标</span>
      <label class="switch sm" title="喂完输入后立刻把目标窗口最小化回任务栏，不让它一直占着桌面。开启后每次脉冲是“从任务栏瞬时弹起→喂真实鼠标→立刻最小化”；目标若本来就在前台(你正在用它)则只发输入、不最小化。">
        <input type="checkbox" id="pulseMin" checked />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label">喂完即最小化</span>
      </label>
      <button id="pulseNow" class="btn ghost small" title="立即手动触发一次前台脉冲（不等间隔）。用来确认“弹起→喂输入→最小化”是否生效：点完看活动日志会逐窗口报告 切前台✓/喂鼠标✓/最小化✓，或失败原因。"><svg class="ico"><use href="#i-zap"/></svg>立即脉冲</button>
    </div>

    <div class="logbar">
      <button class="logtoggle" id="logToggle" title="展开/收起日志面板"><svg class="ico chev"><use href="#i-chevron"/></svg></button>
      <div class="logtabs">
        <button class="logtab active" id="tabActivity" data-view="activity"><svg class="ico"><use href="#i-activity"/></svg>活动日志</button>
        <button class="logtab" id="tabHook" data-view="hook" title="实时跟踪被注入 DLL 写出的拦截日志(%TEMP%\KeepAliveHook.log)：StartHooking / 每条规则挂了几个 IAT 槽位 / ReloadHooks / 卸载"><svg class="ico"><use href="#i-eye"/></svg>拦截日志<span class="pill hookbadge hidden" id="hookCount">0</span></button>
      </div>
      <div class="status" id="status">就绪</div>
      <label class="switch sm" title="观察模式：对一组检测类 API(前台 GetForegroundWindow / 空闲 GetLastInputInfo / 反调试 IsDebuggerPresent 等)装透传计数钩子，不改行为，只在「拦截日志」里实时显示目标调用了哪些 API、各调了多少次。需先对目标注入，再点“应用规则”生效。">
        <input type="checkbox" id="logAll" />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label">全量 API 日志(观察)</span>
      </label>
      <button id="openLog" class="btn ghost small" title="用系统默认程序打开拦截日志文件(%TEMP%\KeepAliveHook.log)"><svg class="ico"><use href="#i-folder"/></svg>打开文件</button>
    </div>
    <div class="logpanel" id="logPanel">
      <div class="logview" id="logViewActivity"></div>
      <div class="logview hidden" id="logViewHook"></div>
    </div>
  </footer>

  <!-- ===== 规则编辑弹窗 ===== -->
  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <div class="modal-head"><svg class="ico"><use href="#i-edit"/></svg><span id="modalTitle">添加规则</span></div>
      <div class="modal-body">
        <div class="field"><label>名称</label><input id="r_name" placeholder="（可留空，自动命名）" /></div>

        <div class="field"><label>类型</label>
          <div class="segmented" id="r_kind_seg">
            <button type="button" class="seg" data-kind="keepalive">保活</button>
            <button type="button" class="seg" data-kind="idle">idle 归零</button>
            <button type="button" class="seg" data-kind="fg">前台伪装</button>
            <button type="button" class="seg" data-kind="uncapture">防截屏</button>
            <button type="button" class="seg" data-kind="hook">hook 拦截</button>
          </div>
          <input type="hidden" id="r_kind" value="keepalive" />
        </div>
        <div class="kind-desc" id="kindDesc"></div>

        <div class="field row-ka"><label>间隔(秒)</label><input id="r_interval" type="number" min="1" max="3600" value="30" /></div>

        <div class="field row-hd"><label>模块 DLL</label><div class="combo"><input id="r_dll" value="user32.dll" autocomplete="off" spellcheck="false" /></div></div>
        <div class="field row-hd"><label>函数名</label><div class="combo"><input id="r_func" placeholder="输入即筛选导出函数 · ↑↓ 选择 · 回车确认" autocomplete="off" spellcheck="false" /></div></div>
        <div class="func-sig hide" id="funcSig"></div>

        <div class="row-hook group-sep"><span class="gt">拦截动作</span><span class="gh">改入参 · 调原函数 · 改返回；都不设 = 透传</span></div>
        <div class="field args-field row-hook"><label>入参覆盖</label><div class="args-rows" id="argsRows"></div></div>
        <label class="opt-row row-hook"><input type="checkbox" id="r_call" checked /><span class="opt-text"><b>调用原函数</b><small>取消 = 完全拦截，直接返回下方 mock 值</small></span></label>
        <div class="field row-hook"><label>返回值</label>
          <div class="retrow">
            <label class="chk"><input type="checkbox" id="r_reten" /><span>拦截返回 / mock</span></label>
            <input id="r_retval" placeholder="0 / 1 / 0x1" autocomplete="off" />
          </div>
        </div>

        <label class="opt-row"><input type="checkbox" id="r_enabled" checked /><span class="opt-text"><b>启用此规则</b></span></label>
      </div>
      <div class="modal-foot"><button id="r_cancel" class="btn ghost">取消</button><button id="r_ok" class="btn primary">确定</button></div>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
